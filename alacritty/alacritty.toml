# ==============================================================================
# Alacritty Configuration
# ==============================================================================

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "Full"
opacity = 0.95
blur = true

# ==============================================================================
# Typography (Caskaydia Cove)
# ==============================================================================
[font]
size = 12.0

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

# ==============================================================================
# Terminal Mechanics & Scrollback
# ==============================================================================
[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "Off" }
blink_interval = 500
unfocused_hollow = true

[selection]
save_to_clipboard = true

